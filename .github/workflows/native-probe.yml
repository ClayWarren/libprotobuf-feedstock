name: libprotobuf native Windows ARM64
on:
  push:
    branches: [codex/libprotobuf-arm64-probe]
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'ClayWarren/libprotobuf-feedstock'
    runs-on: windows-11-arm
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        config: [win_arm64_]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Retrieve verified native JsonCpp prerequisite
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path C:/protobuf-prereqs/win-arm64 -Force | Out-Null
          gh run download 34691083346 --repo ClayWarren/jsoncpp-feedstock --name jsoncpp-arm64-package --dir "$env:RUNNER_TEMP/jsoncpp"
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
          $pkg = @(Get-ChildItem "$env:RUNNER_TEMP/jsoncpp" -Recurse -Filter 'jsoncpp-1.9.8-h11ae69d_2.conda')
          if ($pkg.Count -ne 1) { throw 'Expected one exact prerequisite' }
          if ((Get-FileHash $pkg[0].FullName -Algorithm SHA256).Hash.ToLower() -ne 'ba1983d40789454c25151ff85836e67f9fd7d43be62153ba822563eec4032e11') { throw 'Prerequisite checksum mismatch' }
          Copy-Item $pkg[0].FullName C:/protobuf-prereqs/win-arm64/
      - name: Build and test libprotobuf
        shell: cmd
        env:
          BUILD_PLATFORM: win-arm64
          CI: github_actions
          CONDA_BLD_PATH: C:\bld
          CONFIG: ${{ matrix.config }}
          MINIFORGE_HOME: C:\Miniforge
          PYTHONUNBUFFERED: '1'
          UPLOAD_PACKAGES: 'False'
          CONDA_CHANNEL_PRIORITY: strict
          EXTRA_CB_OPTIONS: '--override-channels -c file:///C:/protobuf-prereqs -c conda-forge'
          RATTLER_BUILD_COLOR: always
          RATTLER_BUILD_ENABLE_GITHUB_INTEGRATION: 'true'
        run: |
          set "flow_run_id=github_%GITHUB_RUN_ID%"
          set "remote_url=https://github.com/%GITHUB_REPOSITORY%"
          set "sha=%GITHUB_SHA%"
          call ".scripts\run_win_build.bat"
      - name: Preserve libprotobuf package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: libprotobuf-arm64-package
          path: C:\bld\win-arm64\*.conda
          if-no-files-found: warn
          retention-days: 7
